<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Song Recommendation System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f0f0f;
        color: #ffffff;
      }
      .loading {
        display: none;
      }
      .loading.active {
        display: block;
      }
      .search-container {
        background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%);
        border-bottom: 1px solid #303030;
      }
      .song-card {
        transition: all 0.3s ease;
        background: #181818;
        border-radius: 8px;
      }
      .song-card:hover {
        transform: translateY(-5px);
        background: #282828;
      }
      .video-container {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        border-radius: 8px;
      }
      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .search-input {
        background: #121212;
        border: 1px solid #303030;
        color: #ffffff;
      }
      .search-input:focus {
        background: #282828;
        border-color: #3ea6ff;
      }
      .search-input::placeholder {
        color: #aaaaaa;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen">
      <!-- Header -->
      <div class="search-container py-8">
        <div class="container mx-auto px-4">
          <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-center mb-2">
              Discover Your Next Favorite Song
            </h1>

            <div class="bg-[#181818] rounded-xl p-6 shadow-lg">
              <form id="recommendationForm" class="space-y-4">
                <div>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    placeholder="Enter song title"
                    class="search-input w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#3ea6ff] transition duration-200"
                  />
                </div>

                <div>
                  <input
                    type="text"
                    id="artist"
                    name="artist"
                    placeholder="Enter artist name (optional)"
                    class="search-input w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#3ea6ff] transition duration-200"
                  />
                </div>

                <button
                  type="submit"
                  class="w-full bg-[#3ea6ff] text-white py-3 px-6 rounded-lg hover:bg-[#1a73e8] focus:outline-none focus:ring-2 focus:ring-[#3ea6ff] focus:ring-offset-2 focus:ring-offset-[#181818] transition duration-200"
                >
                  Get Recommendations
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Results Section -->
      <div class="container mx-auto px-4 py-12">
        <div
          class="loading bg-[#181818] rounded-lg shadow-md p-6 max-w-4xl mx-auto"
        >
          <div class="flex items-center justify-center">
            <div
              class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#3ea6ff]"
            ></div>
            <span class="ml-2 text-gray-400">Loading recommendations...</span>
          </div>
        </div>

        <div
          id="results"
          class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6"
        >
          <!-- Recommendations will be inserted here -->
        </div>

        <div
          id="error"
          class="bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded relative hidden max-w-4xl mx-auto"
          role="alert"
        >
          <span class="block sm:inline" id="errorMessage"></span>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("recommendationForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const title = document.getElementById("title").value;
          const artist = document.getElementById("artist").value;

          document.querySelector(".loading").classList.add("active");
          document.getElementById("results").innerHTML = "";
          document.getElementById("error").classList.add("hidden");

          try {
            const response = await fetch("/recommend", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-API-Key": "senseyourtune",
              },
              body: JSON.stringify({ title, artist }),
            });

            const data = await response.json();

            if (response.ok) {
              if (data.recommendations && data.recommendations.length > 0) {
                const resultsContainer = document.getElementById("results");
                data.recommendations.forEach((rec) => {
                  const recElement = document.createElement("div");
                  recElement.className = "song-card p-4 hover:shadow-lg";
                  recElement.innerHTML = `
                    <div class="flex flex-col space-y-4">
                      <div class="flex items-start justify-between">
                        <div class="flex-1">
                          <h3 class="text-lg font-semibold text-white mb-1">${
                            rec.title
                          }</h3>
                          <p class="text-gray-400 mb-2">${rec.artist}</p>
                          <p class="text-sm text-[#3ea6ff]">Score: ${rec.weighted_score.toFixed(
                            3
                          )}</p>
                        </div>
                      </div>
                      ${
                        rec.preview_url
                          ? `
                        <div class="video-container">
                          <iframe src="${rec.preview_url}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                          </iframe>
                        </div>
                      `
                          : ""
                      }
                    </div>
                  `;
                  resultsContainer.appendChild(recElement);
                });
              } else {
                document.getElementById("errorMessage").textContent =
                  "No recommendations found.";
                document.getElementById("error").classList.remove("hidden");
              }
            } else {
              document.getElementById("errorMessage").textContent =
                data.error || "An error occurred.";
              document.getElementById("error").classList.remove("hidden");
            }
          } catch (error) {
            document.getElementById("errorMessage").textContent =
              "An error occurred while fetching recommendations.";
            document.getElementById("error").classList.remove("hidden");
          } finally {
            document.querySelector(".loading").classList.remove("active");
          }
        });
    </script>
  </body>
</html>
